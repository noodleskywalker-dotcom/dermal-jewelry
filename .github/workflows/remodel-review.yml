name: DERMAL remodel review

on:
  push:
    branches: [feat/dermal-first-slice]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --workers=2 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
      - run: npm run build
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: remodel-browser-review
          path: test-results/
          retention-days: 14
